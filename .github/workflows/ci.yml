name: Week 9 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app tests

      - name: Verify Week 9 modules import
        run: |
          python -c "from app.hybrid import hybrid_search; print('hybrid OK')"
          python -c "from app.answer import ask; print('answer OK')"
          python -c "from app.keyword import keyword_search; print('keyword OK')"
          python -c "from app.rerank import rerank; print('rerank OK')" || true

      - name: Run tests
        run: pytest -v